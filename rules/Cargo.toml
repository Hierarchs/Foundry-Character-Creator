[package]
name = "genesis-rules"
description = "D&D 5e character-building rules engine for the Character Genesis Foundry VTT module"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib -> genesis_rules.wasm for the browser, rlib -> native unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
